<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7e1d8">
<title>Astraia Joias · Catálogo de encomendas</title>
<meta name="description" content="Catálogo de joias da Astraia Joias. Escolha as peças, monte seu carrinho e finalize o pedido pelo WhatsApp.">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top" id="top">
  <div class="top-row">
    <a class="brand" href="#/" aria-label="Astraia Joias, início"><img class="b-logo" src="/assets/logo-horizontal.png" alt="Astraia Joias" width="560" height="166"></a>
    <button class="cart-btn" id="cartBtn" type="button" aria-label="Abrir carrinho">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 4h2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.5-1.1L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.4" fill="currentColor"/><circle cx="17" cy="19.5" r="1.4" fill="currentColor"/></svg>
      <span class="cart-label">Carrinho</span>
      <span class="badge" id="cartCount" hidden>0</span>
    </button>
  </div>
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Buscar por nome ou código" aria-label="Buscar por nome ou código">
  </form>
  <nav class="chips" id="catNav" aria-label="Categorias"></nav>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <img src="/assets/icon.png" alt="" width="28" height="37">
  <p>Astraia Joias · Pedidos por encomenda pelo WhatsApp</p>
  <p class="small" id="updated"></p>
</footer>

<button class="cart-bar" id="cartBar" type="button" hidden>
  <span class="cb-left"><b id="cbCount">0 itens</b></span>
  <span class="cb-mid">Ver carrinho</span>
  <span class="cb-right" id="cbTotal"></span>
</button>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="overlay" id="overlay" hidden></div>
<section class="sheet" id="productSheet" role="dialog" aria-modal="true" aria-label="Detalhes da peça" hidden></section>
<aside class="drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Carrinho" hidden></aside>

<script src="/app.js"></script>
</body>
</html>
